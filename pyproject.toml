[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-router-poc"
version = "0.1.0"
description = "Local and hosted Gemma benchmarking with pretrained duration estimation"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["inference_router*"]

[project.optional-dependencies]
estimator = ["onnxruntime==1.31.1", "numpy>=2,<3"]
classifiers = ["torch==2.15.0", "transformers==4.57.6", "gliclass==0.1.12", "sentencepiece==0.2.3", "huggingface-hub==0.36.2", "safetensors==0.8.0", "numpy==2.5.4"]

[tool.setuptools.package-data]
"inference_router.vendor.clairvoyant" = ["LICENSE"]
